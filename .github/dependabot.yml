# Version updates: one PR at a time across every ecosystem (multi-ecosystem
#   group, open-pull-requests-limit 1). While it is open, Dependabot updates
#   that PR instead of opening another. Cooldown 14d after release (every entry).
# Security updates: immediate; cooldown never applies to them. One grouped PR
#   per ecosystem. Needs the repo setting "Dependabot security updates".
# Target branch: next (prereleases first; RELEASING.md).
# Action updates regenerate the matching actions.lock entry in the same PR.
#   Majors are ignored there: a new generation is bumped deliberately.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps):"

updates:
  - package-ecosystem: gomod
    target-branch: next
    directories:
      - "/"
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 14
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    target-branch: next
    directories:
      - "/"
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 14
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The release-please pin must match `tooling-ref` and the preflight
      # pin (see release-please.yml); moved by hand, all three together.
      # Reusable workflows are named by their path, so match those too.
      - dependency-name: "hop-top/.github"
      - dependency-name: "hop-top/.github/.github/workflows/release-please-*"
