name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branch="gh-pages"
          tmp="$(mktemp -d)"
          cd "$tmp"

          cat > _redirects <<'EOF'
          /* /index.html 200
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />

              <meta name="go-import" content="hop.top/gym git https://github.com/hop-top/gym" />

              <meta name="go-source" content="hop.top/gym https://github.com/hop-top/gym https://github.com/hop-top/gym/tree/main{/dir} https://github.com/hop-top/gym/blob/main{/dir}/{file}#L{line}" />

              <script>
                (function () {
                  var p = new URLSearchParams(window.location.search);
                  if (p.get("go-get") !== "1") {
                    window.location.replace("https://github.com/hop-top/gym");
                  }
                })();
              </script>
              <noscript>
                <meta http-equiv="refresh" content="0;url=https://github.com/hop-top/gym" />
              </noscript>

              <title>gym</title>
            </head>
            <body>
              <p>
                Go vanity import metadata for gym. Repo:
                <a href="https://github.com/hop-top/gym">https://github.com/hop-top/gym</a>
              </p>
            </body>
          </html>
          EOF

          cat > README.md <<'EOF'
          # gym website branch

          This branch is generated by CI.

          Behavior:
          - `?go-get=1` => serves Go vanity `go-import` metadata (static HTML)
          - otherwise => JS redirect to `https://github.com/hop-top/gym`
          EOF

          git init
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "publish website" --allow-empty
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
