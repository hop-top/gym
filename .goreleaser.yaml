version: 2

project_name: gym

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gym
    main: ./cmd/gym
    binary: gym
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/hop-top/gym/internal/cli.buildVersion={{.Version}}
        -X github.com/hop-top/gym/internal/cli.buildCommit={{.Commit}}
        -X github.com/hop-top/gym/internal/cli.buildDate={{.Date}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
