name: no-package-installer
when: |
  has(payload.postinstall) && payload.postinstall.matches(
    '(?i)\\b(npm\\s+install|yarn\\s+(add|install)|pnpm\\s+(add|install)|pip\\s+install|pip3\\s+install|brew\\s+install|apt(-get)?\\s+install|cargo\\s+install|gem\\s+install|go\\s+install)\\b'
  )
effect: warn
otherwise: allow
severity: warn
message: install shells out to a system package manager (npm/pip/brew/apt/cargo/gem/go install)
