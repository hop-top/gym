name: no-secret-leak
when: |
  has(payload.scan) && (
    payload.scan.matches('AKIA[0-9A-Z]{16}') ||
    payload.scan.matches('ghp_[A-Za-z0-9]{30,}') ||
    payload.scan.matches('github_pat_[A-Za-z0-9_]{30,}') ||
    payload.scan.matches('xox[baprs]-[A-Za-z0-9-]{10,}') ||
    payload.scan.matches('eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}')
  )
effect: deny
otherwise: allow
severity: deny
message: skill files contain a high-confidence secret (AWS key, GH token, JWT, Slack token)
