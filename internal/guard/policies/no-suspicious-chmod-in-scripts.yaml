name: no-suspicious-chmod-in-scripts
when: |
  has(payload.scripts) && payload.scripts.exists(s, s.matches(
    '(?i)\\bchmod\\b[^\\n]*(\\+s|[0-7]*7[0-7]{2})[^\\n]*(\\s/usr|\\s/bin|\\s/etc|\\s~/.ssh|\\s\\$HOME/\\.ssh)'
  ))
effect: warn
otherwise: allow
severity: warn
message: a script file runs chmod on /usr, /bin, /etc, or ~/.ssh
